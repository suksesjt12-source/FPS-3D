name: Build Tactical Strike Android APK (Root)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Native C++ Engine & Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TacticalStrike

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK, NDK 26.3.11579264 & CMake 3.22.1
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            ndk;26.3.11579264
            cmake;3.22.1

      - name: Verify Android SDK Licenses, NDK & CMake
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          set -o pipefail
          test -f "${SDK_ROOT}/ndk/26.3.11579264/source.properties"
          test -x "${SDK_ROOT}/cmake/3.22.1/bin/cmake"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK (arm64-v8a + armeabi-v7a)
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build Release Unsigned APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify Native Libraries inside APK
        run: |
          APK_FILES="$(unzip -l app/build/outputs/apk/debug/app-debug.apk)"
          echo "${APK_FILES}" | grep "lib/arm64-v8a/libtacticalstrike.so"
          echo "${APK_FILES}" | grep "lib/armeabi-v7a/libtacticalstrike.so"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TacticalStrike-ZeroHour-debug-apk
          path: TacticalStrike/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Release Unsigned APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TacticalStrike-ZeroHour-release-unsigned-apk
          path: TacticalStrike/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
