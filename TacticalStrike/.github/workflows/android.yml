name: Build Tactical Strike Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Native C++ Engine & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK 26.3.11579264 & CMake 3.22.1
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ensure gradlew is executable & wrapper jar exists
        run: |
          chmod +x gradlew
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.7
          fi

      - name: Build Debug APK (arm64-v8a + armeabi-v7a)
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release Unsigned APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify Native Libraries inside APK
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E "lib/(arm64-v8a|armeabi-v7a)/libtacticalstrike.so"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TacticalStrike-ZeroHour-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release Unsigned APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TacticalStrike-ZeroHour-release-unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
